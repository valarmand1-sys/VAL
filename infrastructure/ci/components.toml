# The component graph of 01-architecture.md §3, in machine-readable form.
#
# `allowed_dependencies` is an allowlist, not a denylist. §3 states four rules:
#
#   - policy depends on domain only; never on desktop, api, worker, or providers
#   - worker never depends on desktop
#   - providers never depends on policy — routing asks policy, policy never asks a provider
#   - no circular package dependencies
#
# An allowlist satisfies all four and is strictly narrower than the four rules,
# which is permitted: an implementation may narrow an authority boundary, never
# broaden one (/CLAUDE.md, invariant 5). Any edge not listed here is a violation,
# so a new dependency direction must be added deliberately rather than by import.
#
# The graph is acyclic by construction; check_boundaries.py verifies that rather
# than assuming it.

[[component]]
name = "domain"
path = "packages/domain"
languages = ["python"]
python_module = "val_domain"
distribution = "val-domain"
allowed_dependencies = []

[[component]]
name = "policy"
path = "packages/policy"
languages = ["python"]
python_module = "val_policy"
distribution = "val-policy"
allowed_dependencies = ["domain"]

[[component]]
name = "providers"
path = "packages/providers"
languages = ["python"]
python_module = "val_providers"
distribution = "val-providers"
allowed_dependencies = ["domain"]

[[component]]
name = "mcp"
path = "packages/mcp"
languages = ["python"]
python_module = "val_mcp"
distribution = "val-mcp"
allowed_dependencies = ["domain"]

# The Model Gateway. All inference enters here (01-architecture.md §5.1).
#
# DIRECTION RULE, decided by Lord Armand on 15 August 2026: gateway may depend on
# policy, providers, and domain. **Nothing may depend on gateway except the apps.**
# It is a shared package rather than a service so that api and worker share one
# implementation and one model_calls write path without either process depending
# on the other being alive — one write path is a property of one implementation,
# not one process.
[[component]]
name = "gateway"
path = "packages/gateway"
languages = ["python"]
python_module = "val_gateway"
distribution = "val-gateway"
allowed_dependencies = ["domain", "policy", "providers"]

[[component]]
name = "api"
path = "apps/api"
languages = ["python"]
python_module = "val_api"
distribution = "val-api"
allowed_dependencies = ["domain", "policy", "providers", "mcp", "gateway"]

[[component]]
name = "worker"
path = "apps/worker"
languages = ["python"]
python_module = "val_worker"
distribution = "val-worker"
allowed_dependencies = ["domain", "policy", "providers", "mcp", "gateway"]

# The desktop shell reaches the service over HTTP. It imports no other component
# and no other component imports it.
[[component]]
name = "desktop"
path = "apps/desktop"
languages = ["typescript", "rust"]
npm_package = "val-desktop"
cargo_crate = "val_desktop"
allowed_dependencies = []

# Provider SDKs may be imported in exactly one place (01-architecture.md §5.1:
# "No component calls a provider SDK directly"; 04-layer-0.md WP-0.4 requires CI
# to enforce it). An import of any of these outside `providers` is a violation,
# reported like any other forbidden edge.
[provider_sdks]
owner = "providers"
modules = ["anthropic", "openai", "google", "google_genai", "cohere", "mistralai", "groq", "ollama"]
