# Alembic configuration for Val's authoritative store.
#
# The migration set lives in packages/domain, alongside the schema it applies
# (01-architecture.md §3 — domain owns schemas and typed contracts). This file
# sits at the repository root so `alembic` is run from one place.
#
# No URL appears here. It is read from VAL_DATABASE_URL by env.py, so that no
# credential is ever committed.

[alembic]
script_location = packages/domain/migrations
prepend_sys_path = .
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
