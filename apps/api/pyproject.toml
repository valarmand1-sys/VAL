[project]
name = "val-api"
version = "0.0.0"
description = "FastAPI service."
requires-python = ">=3.14,<3.15"
dependencies = [
    "val-domain",
    "val-policy",
    "val-providers",
    # Pinned here because WP-0.1 owns toolchain pinning and 01-architecture.md §3
    # names this stack. No application code uses them yet; that is WP-0.7 onward.
    "fastapi==0.141.1",
    "pydantic-settings==2.15.0",
    "uvicorn==0.52.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/val_api"]

[tool.uv.sources]
val-domain = { workspace = true }
val-policy = { workspace = true }
val-providers = { workspace = true }
