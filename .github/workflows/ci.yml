name: CI

# Every action is pinned to a full commit SHA, checked by check_pins.py.
# The trailing comment records which release the SHA corresponds to.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: No credentials in the tree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scanner asks git which files are committable, so it needs the
          # repository, not a shallow export.
          fetch-depth: 1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.3
          enable-cache: true
      - run: uv python install
      - run: uv run --no-project python infrastructure/ci/check_secrets.py

  pins:
    name: Versions are pinned
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.3
          enable-cache: true
      - run: uv python install
      - run: uv run --no-project python infrastructure/ci/check_pins.py
      # Governance stays in step: CLAUDE.md's Current work restates the newest
      # scope ruling recorded in the baselines, or this fails (1 September 2026).
      - run: uv run --no-project python infrastructure/ci/check_scope_ruling.py

  boundaries:
    name: Dependency direction
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.3
          enable-cache: true
      - run: uv sync --all-packages --locked
      # Cross-language edges and manifest-declared dependencies.
      - run: uv run python infrastructure/ci/check_boundaries.py
      # Transitive Python imports.
      - run: uv run lint-imports

  python:
    name: Python service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.3
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Everything that does not need PostgreSQL.
      #
      # Corrected 17 August 2026: this job previously ran `infrastructure/ci/tests`
      # alone, so the policy and gateway suites were green locally and were never
      # executed by CI at all.
      #
      # `test_persistence.py` is ignored here rather than named-and-skipped: it
      # tests the model_calls write path against a real database, so failing
      # loudly when there is none is the behaviour it should have. The `database`
      # job runs it. The ledger's concurrency tests skip themselves for the same
      # reason and are also re-run there.
      #
      # Ignoring one file rather than listing two keeps a new gateway test file
      # picked up automatically instead of silently unrun — which is precisely
      # the failure this whole correction was made to fix.
      - run: >-
          uv run pytest
          infrastructure/ci/tests packages/policy/tests packages/gateway/tests
          --ignore=packages/gateway/tests/test_persistence.py

  database:
    name: Database and migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        # pgvector/pgvector:pg18, pinned by digest. The major version must match
        # the local instance and the Layer 3 box; `test_postgres_major_version_is_18`
        # asserts it rather than trusting this comment.
        image: pgvector/pgvector@sha256:691673308c99d2161ba298736f3147f1f22d79de2fb7ec93ae9b4afcab870b62
        env:
          # No password exists to leak. The container is reachable only from this
          # job, and a throwaway credential in a committed file is still a
          # credential-shaped literal (00-charter.md §6).
          POSTGRES_USER: val
          POSTGRES_DB: val_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      VAL_DATABASE_URL: postgresql+psycopg://val@localhost:5433/val_test
      VAL_TEST_DATABASE_URL: postgresql+psycopg://val@localhost:5433/val_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.3
          enable-cache: true
      - run: uv sync --all-packages --locked
      # WP-0.2's acceptance criteria, run as steps rather than asserted.
      - name: upgrade head against an empty database
        run: uv run alembic upgrade head
      - name: downgrade base
        run: uv run alembic downgrade base
      - name: upgrade head again — migrations are reversible
        run: uv run alembic upgrade head
      - name: schema matches 04-layer-0.md §2
        run: uv run pytest packages/domain/tests
      # The write path, and the budget ledger under real concurrency. These
      # cannot be proved against a fake — an in-process fake is the exact thing
      # the reservation design forbids relying on.
      - name: model_calls write path and budget ledger
        run: uv run pytest packages/gateway/tests
      - name: Provider adapter contract tests
        run: uv run pytest packages/providers/tests
      # WP-0.10: the service behind the text interface, against the real store.
      - name: Text-interface service
        run: uv run pytest apps/api/tests

  desktop:
    name: Desktop shell
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      # WP-0.10: invariant 29 at the display layer — the presentation rules
      # (pending means pending; contamination is named) are tested directly.
      - run: npm test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      # rustup reads rust-toolchain.toml and installs the pinned channel.
      - run: rustup show active-toolchain
      - run: cargo build --locked
        working-directory: apps/desktop/src-tauri
