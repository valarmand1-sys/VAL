name: CI

# Every action is pinned to a full commit SHA, checked by check_pins.py.
# The trailing comment records which release the SHA corresponds to.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: Versions are pinned
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.3
          enable-cache: true
      - run: uv python install
      - run: uv run --no-project python infrastructure/ci/check_pins.py

  boundaries:
    name: Dependency direction
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.3
          enable-cache: true
      - run: uv sync --all-packages --locked
      # Cross-language edges and manifest-declared dependencies.
      - run: uv run python infrastructure/ci/check_boundaries.py
      # Transitive Python imports.
      - run: uv run lint-imports

  python:
    name: Python service
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.12.3
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  desktop:
    name: Desktop shell
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      # rustup reads rust-toolchain.toml and installs the pinned channel.
      - run: rustup show active-toolchain
      - run: cargo build --locked
        working-directory: apps/desktop/src-tauri
