[project]
name = "val-domain"
version = "0.0.0"
description = "Schemas and typed contracts. Depends on nothing else in the workspace."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.13.4",
    # The authoritative store's schema and its migration set live here, because
    # both apps/api and apps/worker need them and domain is the shared contract
    # package (01-architecture.md §3).
    "SQLAlchemy==2.0.52",
    "alembic==1.19.1",
    "psycopg[binary]==3.3.4",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/val_domain"]
