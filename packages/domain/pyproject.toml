[project]
name = "val-domain"
version = "0.0.0"
description = "Schemas and typed contracts. Depends on nothing else in the workspace."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.13.4",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/val_domain"]
