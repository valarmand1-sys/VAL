[project]
name = "val-gateway"
version = "0.0.0"
description = "The Model Gateway. Depends on policy and providers; imported by apps only."
requires-python = ">=3.14,<3.15"
dependencies = [
    "val-domain",
    "val-policy",
    "val-providers",
    # The gateway writes model_calls and reads month-to-date spend back out of
    # it. SQLAlchemy comes via val-domain, which owns the schema, but the
    # dependency is declared here because this package uses it directly.
    "SQLAlchemy==2.0.52",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/val_gateway"]

[tool.uv.sources]
val-domain = { workspace = true }
val-policy = { workspace = true }
val-providers = { workspace = true }
