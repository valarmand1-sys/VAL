[project]
name = "val-mcp"
version = "0.0.0"
description = "MCP client and Tool Registry. Structure only; the capability arrives at Layer 2."
requires-python = ">=3.14,<3.15"
dependencies = [
    "val-domain",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/val_mcp"]

[tool.uv.sources]
val-domain = { workspace = true }
