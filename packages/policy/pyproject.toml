[project]
name = "val-policy"
version = "0.0.0"
description = "Deterministic classification and permission evaluation. Depends on domain only."
requires-python = ">=3.14,<3.15"
dependencies = [
    "val-domain",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/val_policy"]

[tool.uv.sources]
val-domain = { workspace = true }
